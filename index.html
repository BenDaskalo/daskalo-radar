  <title>המרכז הישראלי לרייטינג בדיגיטל</title>
  <style>
    :root{
      --ink:#0A0A0F; --surface:#14141C; --surface2:#1C1C28; --surface3:#23232F;
      --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
      --gold:#F2CE6B; --gold-deep:#C99B3A;
      --rose:#FF3E74; --rose-soft:#FF6B93;
      --up:#37D67A; --down:#FF5470; --hot:#FF8A3D;
      --text:#F6F4EF; --muted:#9C99AD; --violet:#6C4BF0; --r:18px;
    }
    html,body,:root[data-theme="light"],:root[data-theme="dark"]{background:var(--ink);}
    *{box-sizing:border-box;}
    .app{
      background:
        radial-gradient(1200px 700px at 78% -8%, rgba(108,75,240,.18), transparent 60%),
        radial-gradient(900px 600px at 10% 108%, rgba(255,62,116,.12), transparent 55%),
        var(--ink);
      color:var(--text); min-height:100vh; width:100%; overflow-x:hidden;
      font-family:"SF Hebrew",system-ui,-apple-system,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased; position:relative;
    }
    canvas.stars{position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; opacity:.5;}
    .wrap{position:relative; z-index:2; max-width:820px; margin:0 auto; padding:0 20px;}
    .num{font-variant-numeric:tabular-nums; direction:ltr; unicode-bidi:isolate;}
    .hide{display:none!important;}

    /* ===== פתיחה + בחירת זירה ===== */
    .hero{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:22px; padding:56px 20px;}
    .brand-chip{display:inline-flex; align-items:center; gap:9px; padding:8px 16px; border:1px solid var(--line2); border-radius:100px; background:rgba(255,255,255,.03); font-size:13px; letter-spacing:.12em; color:var(--muted);}
    .brand-chip b{color:var(--gold); font-weight:800;}
    .dot{width:7px; height:7px; border-radius:50%; background:var(--up); box-shadow:0 0 10px var(--up);}
    h1.title{margin:0; font-weight:900; line-height:1.02; letter-spacing:-.02em; font-size:clamp(34px,8vw,68px); text-wrap:balance;}
    h1.title .grad{background:linear-gradient(100deg,#fff 0,#fff 38%,var(--gold) 78%,var(--gold-deep) 100%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
    .sub{margin:0; color:var(--muted); font-size:clamp(15px,3.6vw,18px); font-weight:500;}
    .sub b{color:var(--text); font-weight:700;}

    .picker{width:100%; max-width:560px; display:flex; flex-direction:column; gap:14px; margin-top:4px;}
    .picker .lbl{font-size:12px; letter-spacing:.14em; color:var(--muted); text-align:center;}
    .arena{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
    @media(min-width:560px){ .arena{grid-template-columns:repeat(4,1fr);} }
    .arena button{cursor:pointer; font-family:inherit; color:var(--text); border:1px solid var(--line2); background:var(--surface); border-radius:14px; padding:14px 8px; display:flex; flex-direction:column; align-items:center; gap:6px; font-weight:800; font-size:14px; transition:.16s;}
    .arena button .ic{font-size:22px;}
    .arena button small{font-weight:600; color:var(--muted); font-size:11px;}
    .arena button[aria-pressed="true"]{border-color:var(--gold); background:linear-gradient(180deg,rgba(242,206,107,.14),var(--surface)); box-shadow:0 0 0 1px rgba(242,206,107,.4);}
    .arena button:disabled{opacity:.5; cursor:not-allowed;}
    .seg{display:inline-flex; background:var(--surface); border:1px solid var(--line2); border-radius:100px; padding:4px; gap:4px; align-self:center;}
    .seg button{cursor:pointer; font-family:inherit; color:var(--muted); font-weight:800; font-size:13px; border:0; background:transparent; padding:8px 18px; border-radius:100px; transition:.16s;}
    .seg button[aria-pressed="true"]{background:var(--rose); color:#fff;}

    .cta{margin-top:6px; border:0; cursor:pointer; color:#fff; font-weight:900; font-size:clamp(19px,4.4vw,23px); font-family:inherit; padding:22px 56px; border-radius:100px; position:relative; background:linear-gradient(180deg,var(--rose-soft),var(--rose)); box-shadow:0 12px 40px -8px rgba(255,62,116,.7), inset 0 1px 0 rgba(255,255,255,.35); transition:transform .18s, box-shadow .18s;}
    .cta:hover{transform:translateY(-2px) scale(1.02);}
    .cta:active{transform:translateY(0) scale(.99);}
    .cta:focus-visible{outline:3px solid #fff; outline-offset:4px;}
    .cta::after{content:""; position:absolute; inset:-3px; border-radius:100px; background:conic-gradient(from 0deg,transparent,rgba(255,62,116,.6),transparent 40%); animation:spin 3.5s linear infinite; z-index:-1; filter:blur(7px);}
    @keyframes spin{to{transform:rotate(360deg);}}
    .pulse{display:inline-block; margin-inline-start:8px; animation:beat 1.4s ease-in-out infinite;}
    @keyframes beat{0%,100%{transform:scale(1);}50%{transform:scale(1.18);}}

    /* ===== סריקת רדאר ===== */
    .scan{position:fixed; inset:0; z-index:30; display:none; flex-direction:column; align-items:center; justify-content:center; gap:22px; background:rgba(8,8,12,.94); backdrop-filter:blur(8px); text-align:center; padding:20px;}
    .scan.on{display:flex;}
    .radar-wrap{position:relative; width:min(280px,74vw); aspect-ratio:1;}
    .radar-ring{position:absolute; inset:0; border-radius:50%; border:1px solid var(--line2);}
    .radar-ring.r2{inset:16%;} .radar-ring.r3{inset:34%;} .radar-ring.r4{inset:52%;}
    .radar-cross{position:absolute; inset:0;}
    .radar-cross::before,.radar-cross::after{content:""; position:absolute; background:var(--line);}
    .radar-cross::before{left:50%; top:0; bottom:0; width:1px; transform:translateX(-50%);}
    .radar-cross::after{top:50%; left:0; right:0; height:1px; transform:translateY(-50%);}
    .sweep{position:absolute; inset:0; border-radius:50%; overflow:hidden;}
    .sweep::before{content:""; position:absolute; inset:0; background:conic-gradient(from 0deg, rgba(55,214,122,.55), rgba(55,214,122,.05) 45deg, transparent 90deg); animation:spin 2.2s linear infinite; border-radius:50%;}
    .radar-core{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;}
    .radar-pct{font-weight:900; font-size:clamp(40px,12vw,64px); letter-spacing:-.03em;}
    .radar-pct small{font-size:.4em; color:var(--muted); margin-inline-start:2px;}
    .blip{position:absolute; width:9px; height:9px; border-radius:50%; background:var(--up); box-shadow:0 0 12px var(--up); opacity:0; animation:blip 2.2s ease-out infinite;}
    @keyframes blip{0%{opacity:0; transform:scale(.4);}12%{opacity:1;}60%{opacity:.5;}100%{opacity:0; transform:scale(1.4);}}
    .scan-txt{font-weight:800; font-size:19px;} .scan-sub{color:var(--muted); font-size:14px; min-height:20px;}
    .scan-hand{color:var(--muted); font-size:12px; direction:ltr;}

    /* ===== תוצאות ===== */
    .results{display:none; padding:30px 0 96px;} .results.on{display:block; animation:fadeUp .55s ease both;}
    @keyframes fadeUp{from{opacity:0; transform:translateY(14px);}to{opacity:1; transform:none;}}
    .res-head{text-align:center; margin-bottom:22px;}
    .res-head .kick{color:var(--gold); font-weight:800; letter-spacing:.14em; font-size:12px;}
    .res-head h2{margin:6px 0 4px; font-size:clamp(24px,6vw,36px); font-weight:900; letter-spacing:-.02em;}
    .res-head .scope{color:var(--muted); font-size:13px;}

    .menu{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
    @media(min-width:640px){ .menu{grid-template-columns:repeat(3,1fr);} }
    .mbtn{cursor:pointer; font-family:inherit; text-align:right; color:var(--text); border:1px solid var(--line2); background:linear-gradient(180deg,var(--surface2),var(--surface)); border-radius:var(--r); padding:16px; display:flex; flex-direction:column; gap:6px; transition:.16s; position:relative;}
    .mbtn:hover{transform:translateY(-3px); border-color:var(--gold); box-shadow:0 16px 40px -18px rgba(242,206,107,.5);}
    .mbtn .ic{font-size:26px;} .mbtn .t{font-weight:900; font-size:16px;} .mbtn .d{color:var(--muted); font-size:12px; line-height:1.4;}
    .mbtn.overview{grid-column:1/-1; align-items:center; text-align:center; border-color:rgba(242,206,107,.5); background:linear-gradient(180deg,rgba(242,206,107,.12),var(--surface));}
    .mbtn.overview .t{font-size:19px;}

    .panel{margin-top:16px; animation:fadeUp .4s ease both;}
    .panel-head{display:flex; align-items:center; gap:10px; margin:8px 0 14px;}
    .panel-head .bar{width:4px; height:30px; border-radius:4px; background:linear-gradient(var(--rose),var(--gold)); flex:none;}
    .panel-head h3{margin:0; font-weight:900; font-size:clamp(19px,5vw,25px);}
    .panel-head .note{margin-inline-start:auto; color:var(--muted); font-size:11px; max-width:150px; text-align:left; line-height:1.35;}

    .av{border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:900; color:#0A0A0F; flex:none;}
    .vbadge{color:#4AA3FF; font-size:.72em; vertical-align:.12em; margin-inline-start:3px;}

    .rows{display:flex; flex-direction:column; gap:8px;}
    .row{display:flex; align-items:center; gap:13px; padding:12px 14px; border:1px solid var(--line); border-radius:14px; background:var(--surface);}
    .row .rank{width:26px; text-align:center; font-weight:900; color:var(--muted); font-size:15px; flex:none;}
    .row .av{width:44px; height:44px; font-size:16px;}
    .row .meta{min-width:0; flex:1;} .row .nm{font-weight:800; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;} .row .hd{color:var(--muted); font-size:12px; direction:ltr; text-align:right;}
    .row .val{text-align:left; flex:none; font-weight:900; font-size:16px;} .row .val small{display:block; font-weight:700; color:var(--muted); font-size:11px;}
    .val.up{color:var(--up);} .val.down{color:var(--down);} .val.gold{color:var(--gold);}
    .podium-badge{width:26px; text-align:center; font-size:18px; flex:none;}

    /* כרטיס דרמטי (פוסט חזק / צניחה) */
    .hero-card{border:1px solid var(--line2); border-radius:var(--r); padding:20px; background:linear-gradient(180deg,var(--surface2),var(--surface)); display:flex; gap:16px; align-items:center;}

    .hero-card .big{font-weight:900; font-size:clamp(26px,8vw,40px); line-height:1;}
    .hero-card .big.gold{color:var(--gold);} .hero-card .big.down{color:var(--down);}

    .hero-card a{color:var(--gold); font-size:12px; text-decoration:none;}

    .empty{border:1px dashed var(--line2); border-radius:var(--r); padding:22px; text-align:center; color:var(--muted); font-size:14px; line-height:1.6;}
    .empty .big{font-size:30px; display:block; margin-bottom:8px;}

    .redo{margin-top:16px; background:transparent; border:1px solid var(--line2); color:var(--text); font-family:inherit; font-weight:700; padding:12px 26px; border-radius:100px; cursor:pointer;}
    .redo:hover{border-color:var(--gold); color:var(--gold);}
    @media(prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important;} .cta::after,.sweep::before{animation:none;} }
